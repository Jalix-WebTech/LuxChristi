<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10213b">
  <title>You're offline | Lux Christi</title>
  <link rel="icon" href="assets/images/lux-christi-mark.svg" type="image/svg+xml">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17243a;background:#f7f4ec}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,560px);padding:clamp(28px,6vw,52px);border:1px solid #e3dccb;border-radius:24px;background:#fff;box-shadow:0 18px 50px #10213b12;text-align:center}
    img{width:76px;height:76px}h1{margin:22px 0 10px;color:#10213b}p{line-height:1.7;color:#536075}
    a,button{display:inline-block;margin-top:14px;padding:12px 20px;border:0;border-radius:999px;background:#10213b;color:#fff;text-decoration:none;font:inherit;font-weight:650;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="assets/images/lux-christi-mark.svg" alt="Lux Christi mark">
    <h1>You're currently offline</h1>
    <p>Lux Christi couldn't reach this page. Check your internet connection and try again. Pages you have already visited may still be available from your device's cache.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <p><a href="index.html">Return to the homepage</a></p>
  </main>
</body>
</html>
